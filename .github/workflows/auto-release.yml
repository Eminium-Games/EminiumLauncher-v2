name: Auto Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Get Version
        id: version
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Check if release exists and has files
        id: check_tag
        shell: powershell
        run: |
          try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/Eminium-Games/EminiumLauncher-v2/releases/tags/v${{ steps.version.outputs.VERSION }}" -Headers @{"Accept"="application/vnd.github.v3+json"}
            $hasExe = $response.assets | Where-Object { $_.name -like "*.exe" }
            if ($hasExe) {
              echo "exists=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "exists=false" >> $env:GITHUB_OUTPUT
            }
          } catch {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Upload File to Existing Release
        if: steps.check_tag.outputs.exists == 'false'
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $releaseId = (Invoke-RestMethod -Uri "https://api.github.com/repos/Eminium-Games/EminiumLauncher-v2/releases/tags/v${{ steps.version.outputs.VERSION }}" -Headers @{"Accept"="application/vnd.github.v3+json", "Authorization"="token $env:GITHUB_TOKEN"}).id
          
          # Upload the exe file
          $exePath = Get-ChildItem -Path "dist" -Filter "*.exe" | Select-Object -First 1
          $uploadUrl = "https://uploads.github.com/repos/Eminium-Games/EminiumLauncher-v2/releases/$releaseId/assets?name=$($exePath.Name)"
          
          Invoke-RestMethod -Uri $uploadUrl -Method POST -Headers @{
            "Authorization" = "token $env:GITHUB_TOKEN"
            "Content-Type" = "application/octet-stream"
          } -InFile $exePath.FullName
