name: Auto Release

on:
  push:
    branches: [ master ]

jobs:
  release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Get Version
        id: version
        shell: powershell
        run: |
          $version = node -p "require('./package.json').version"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Check if release exists and has files
        id: check_tag
        shell: powershell
        run: |
          try {
            $response = Invoke-RestMethod -Uri "https://api.github.com/repos/Eminium-Games/EminiumLauncher-v2/releases/tags/v${{ steps.version.outputs.VERSION }}" -Headers @{"Accept"="application/vnd.github.v3+json"}
            $hasExe = $response.assets | Where-Object { $_.name -like "*.exe" }
            if ($hasExe) {
              echo "exists=true" >> $env:GITHUB_OUTPUT
            } else {
              echo "exists=false" >> $env:GITHUB_OUTPUT
            }
          } catch {
            echo "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Build Windows Release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist:win

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.yml
          name: "Eminium Games Launcher v${{ steps.version.outputs.VERSION }}"
          tag_name: "v${{ steps.version.outputs.VERSION }}"
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
