appId: 'eminiumgameslauncher'
productName: 'Eminium Games Launcher'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2025 Eminium Games'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'
  gatekeeperAssess: false

# Linux Configuration
linux: 
  target: 
    - target: 'dir'
      arch: 'x64'
  maintainer: 'Eminium Games'
  vendor: 'Eminium Games'
  synopsis: 'Modded Minecraft Launcher'
  description: 'Custom launcher which allows users to join modded servers. All mods, configurations, and updates are handled automatically.'
  category: 'Game'

directories:
  buildResources: 'build'
  output: 'dist'
